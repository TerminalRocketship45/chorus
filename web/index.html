<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply a saved Light/Dark choice before first paint so there is no flash of the wrong theme.
      try {
        var t = localStorage.getItem("chorus:theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          var c = t === "dark" ? "#000000" : "#f2f2f7";
          document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", c); });
          });
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Chorus: reading fluency coach</title>
    <meta
      name="description"
      content="Chorus listens to you read aloud and shows which words were hard, without mistaking a first-language accent for a reading mistake."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
